{% extends 'base.html' %}

{% block title %}Edit Note - {{ note.title }}{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='notes.css') }}">

{% endblock %}

{% block contents %}

    <h4>✏️ Edit {{note.title}}</h4>
    
    <form action="{{ url_for('edit_note', nid=note.nid) }}" method="POST">
      <div>

            <label >Note Content:</label>
            <textarea name="updated_content"  required>{{ current_text }}</textarea>
        </div>
        
       
            <button type="submit" class="btn btn-primary" >Update Changes</button>
            <a href="{{ url_for('notes') }}" class="btn btn-secondary" >Cancel</a>
       
    </form>
</div>
{% endblock %}
