<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
     <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
        <div class="container">
            <h2>Smart Study Planner</h2>
            <form method="POST" autocomplete="off" action="{{ url_for('login') }}" >
                <input type="email"  name="email" id="username"  placeholder="email" autocomplete="new-password" required>
          
                <input type="password" name="password" id="password" placeholder="Password"  autocomplete="new-password" required>
                
                <button  type="submit"> Login</button>
              </form>

              {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category , message in messages %}
                 <div class=alert alert-{{category}}>{{ message }}<div>
            {% endfor %}
        {% endif %}
    {% endwith %}
              

             <a href="{{url_for('forgot_password')}}" ><h4>Forget Password?</h4> </a>
             <p>
                Don't have an account?
                <a href="{{ url_for('signup') }}">SignUp</a>
             </p>
                 </div>
                 <script src="{{ url_for('static', filename='signup.js') }}"></script>

            </body>
</html>
