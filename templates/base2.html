<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Base admin{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
    {% block styles %} {% endblock %}
</head>
<body>

<!-- Sidebar -->
<div class="admin-sidebar">
    <div class="brand">
        <img src="{{ url_for('static', filename='uploads/logo.png') }}" width="80px" height="50px">
        <small>Admin Panel</small>
    </div>

    <a href="/admin/dashboard" class="sidebar-link">☄ Dashboard</a>
    <a href="/admin/users" class="sidebar-link">👥 Users</a>
    <a href="/admin/subjects" class="sidebar-link">📚 Subjects</a>
    <a href="/admin/notes" class="sidebar-link">📄 Notes</a>
    <a href="/admin/plans" class="sidebar-link">📋 Weekly Plans</a>
    <a href="/admin/deadlines" class="sidebar-link">⚠ Deadline Alerts</a>
    <a href="/admin/trash" class="sidebar-link">🗑 Trash</a>
    <a href="/admin/logout" class="sidebar-link">↩ Logout</a>

    {% if admin %}
    <a href="{{ url_for('admin_profile') }}" class="text-decoration-none d-flex align-items-center px-3 py-2 rounded transition">
        {% if admin.profile_pic %}
            <img src="{{ url_for('static', filename='uploads/' + admin.profile_pic) }}"
                 alt="Profile"
                 class="rounded-circle border border-primary border-2 shadow-sm me-3"
                 style="width: 44px; height: 44px; object-fit: cover; flex-shrink: 0;">
        {% else %}
            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold shadow-sm me-3"
                 style="width: 44px; height: 44px; font-size: 0.95rem; letter-spacing: 0.5px; flex-shrink: 0;">
                {{ initials }}
            </div>
        {% endif %}

        <div class="d-flex flex-column text-start">
            
        </div>
    </a>
    {% endif %}

</div>

{% block contents %}
{% endblock %}


<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
